{% extends "base.html" %}
{% load static %}
{% block title %}Contact - My Portfolio{% endblock %}
    {% block extra_css %}
      <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    {% endblock %}
{% block content %}
<div class="container my-5 py-5 text-center">
  {% if messages %}
{% for message in messages %}
 <div class="alert alert-{{ message.tags }} alert-dismissible fade show my-5" role="alert">
  {{ message }}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div> 
{% endfor %}
{% endif %}
    <main class="form-signin w-100 m-auto main">
      <form method="post">
        {% csrf_token %}
        <h1 class="h3 mb-3 fw-normal"><em>Please Give Your Info</em></h1>
        <div class="form-floating my-5">
          <input
            type="email"
            name="email"
            class="form-control"
            id="floatingInput"
            placeholder="name@example.com"
          />
          <label for="floatingInput">Email address</label>
        </div>
        <div class="form-floating my-5">
          <input
            type="text"
            name="name"
            class="form-control"
            id="floatingInput"
            placeholder="username"
          />
          <label for="floatingInput">UserName</label>
        </div>

        <div class="form-floating">
          <input
            type="password"
            name="password"
            class="form-control"
            id="floatingPassword"
            placeholder="Password"
          />
          <label for="floatingPassword">Password</label>
        </div>
        <div class="form-floating my-5  ">
          <input
            type=""
            name="desc"
            class="form-control msg"
            id="desc"
            placeholder="desc"
          />
          <label for="desc">Drop your message here</label>
        </div>
        <div class="form-check text-start my-3">
          <input
            class="form-check-input"
            type="checkbox"
            value="remember-me"
            id="checkDefault"
          />
          
          <label class="form-check-label" for="checkDefault">
            Remember me
          </label>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">
          Sign in
        </button>
      </form>
    </main>
    <script
      src="/docs/5.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      class="astro-vvvwv3sm"
    ></script>
</div>
{% endblock %}
